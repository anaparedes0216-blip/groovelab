<div class="cart-popup" id="cart-popup">
    <div class="cart-item">
        <img id="popup-img" src="" alt="">
        <div class="cart-info">
            <p id="popup-title"></p>
            <span id="popup-price"></span>
        </div>
    </div>

    <a href="carrito.html" class="view-cart">Ver carrito</a>
</div>

<script>
  (function () {
    const navEntries = performance.getEntriesByType("navigation");
    if (navEntries.length > 0 && navEntries[0].type === "reload") {
        localStorage.removeItem("cartProducts");
        localStorage.removeItem("cartCount");
    }
})();
document.addEventListener("DOMContentLoaded", function () {

    const cartNumber = document.getElementById("cart-count");

    let cartCount = localStorage.getItem("cartCount")
        ? parseInt(localStorage.getItem("cartCount"))
        : 0;

    cartNumber.textContent = cartCount;

    const buttons = document.querySelectorAll(".add-btn, .btn-add");

    const popup = document.getElementById("cart-popup");
    const popupImg = document.getElementById("popup-img");
    const popupTitle = document.getElementById("popup-title");
    const popupPrice = document.getElementById("popup-price");

    buttons.forEach(button => {
        button.addEventListener("click", () => {

            const card = button.closest(".preventa-card, .stock-card");
            if (!card) return;

            const img = card.querySelector("img").src;
            const title = card.querySelector("h3").textContent;

            // 🔴 quitamos "S/." y lo volvemos número
            const priceText = card.querySelector("p")?.textContent || "S/. 0";
            const price = parseFloat(priceText.replace("S/.", "").trim());

            // 🔵 LEER CARRITO
            let cart = JSON.parse(localStorage.getItem("cartProducts")) || [];

            // 🔵 VER SI YA EXISTE
            const existingProduct = cart.find(item => item.title === title);

            if (existingProduct) {
                existingProduct.qty += 1;
            } else {
                cart.push({
                    img: img,
                    title: title,
                    price: price,
                    qty: 1
                });
            }

            // 🔵 GUARDAR
            localStorage.setItem("cartProducts", JSON.stringify(cart));

            // 🛒 contador
            cartCount++;
            cartNumber.textContent = cartCount;
            localStorage.setItem("cartCount", cartCount);

            // popup
            if (popup) {
                popupImg.src = img;
                popupTitle.textContent = title;
                popupPrice.textContent = "S/. " + price.toFixed(2);

                popup.classList.add("show");
                setTimeout(() => popup.classList.remove("show"), 3000);
            }
        });
    });

});
</script>

<button class="ver-mas-btn" id="verMasBtn">Ver más</button> 

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Lista de artistas extra )
  const artistasExtra = [
    { nombre: "Ariana Grande", imagen: "Artistas/ariana.webp" },
    { nombre: "Humbe", imagen: "Artistas/humbe.jpg" },
    { nombre: "Billie Eilish", imagen: "Artistas/billie.jpg" },
    { nombre: "Conan Gray", imagen: "Artistas/conan.jpg" },
    { nombre: "Selena Gomez", imagen: "Artistas/selena.avif" },
    { nombre: "Kali Uchis", imagen: "Artistas/kali.jpeg" },
    { nombre: "Travis Scott", imagen: "Artistas/taylor.webp" },
    { nombre: "Shakira", imagen: "Artistas/shakira.webp" },
    { nombre: "Kendrick Lamar", imagen: "Artistas/kandrik.webp" },
    { nombre: "Sia", imagen: "Artistas/sia.webp" },
    { nombre: "Milo J", imagen: "Artistas/milo.jpg" },
    { nombre: "Natalia Lafourcade", imagen: "Artistas/natalia.webp" }
  ];

  const containerSelectors = ["#artistsGrid", ".artists-grid", ".artist-grid", ".grid-artistas", ".artist-grid",];
  let grid = null;
  for (const sel of containerSelectors) {
    grid = document.querySelector(sel);
    if (grid) break;
  }

  if (!grid) {
    console.error("VER-MÁS: No se encontró el contenedor de artistas. Selecciones probadas:", containerSelectors);
    return;
  }

  let verMasBtn = document.getElementById("verMasBtn");
  if (!verMasBtn) {
    verMasBtn = document.createElement("button");
    verMasBtn.id = "verMasBtn";
    verMasBtn.className = "ver-mas-btn";
    verMasBtn.textContent = "VER MÁS";
    grid.insertAdjacentElement("afterend", verMasBtn);
  }

  const cardSelectors = [".artist-card", ".card", ".artista-card"];
  let templateCard = null;
  for (const s of cardSelectors) {
    templateCard = document.querySelector(s);
    if (templateCard) break;
  }

  function crearCardFromData(artista) {
    const card = document.createElement("div");
    card.className = templateCard ? templateCard.className : "artist-card";
    card.innerHTML = `
      <img src="${artista.imagen}" alt="${artista.nombre}">
      <p class="artist-name">${artista.nombre}</p>
      <button class="btn-ver">Ver</button>
    `;
    return card;
  }

  function cloneCardWithData(artista) {
    if (!templateCard) return crearCardFromData(artista);

    const clone = templateCard.cloneNode(true);

    const img = clone.querySelector("img");
    if (img) {
      img.src = artista.imagen;
      img.alt = artista.nombre;
    } else {
      const newImg = document.createElement("img");
      newImg.src = artista.imagen;
      newImg.alt = artista.nombre;
      clone.insertAdjacentElement("afterbegin", newImg);
    }

    const nameSelectors = ["p", ".artist-name", ".nombre", "h3", "h4"];
    let nameEl = null;
    for (const sel of nameSelectors) {
      nameEl = clone.querySelector(sel);
      if (nameEl) break;
    }
    if (nameEl) {
      nameEl.textContent = artista.nombre;
    } else {
      const p = document.createElement("p");
      p.className = "artist-name";
      p.textContent = artista.nombre;
      clone.appendChild(p);
    }



    return clone;
  }

  let index = 0;

  verMasBtn.addEventListener("click", () => {
    if (index >= artistasExtra.length) {
      verMasBtn.style.display = "none";
      return;
    }

    const toAdd = Math.min(9, artistasExtra.length - index);
    for (let i = 0; i < toAdd; i++) {
      const artista = artistasExtra[index++];
      const newCard = templateCard ? cloneCardWithData(artista) : crearCardFromData(artista);
      grid.appendChild(newCard);
    }

    if (index >= artistasExtra.length) {
      verMasBtn.style.display = "none";
    }

  });

});
</script>

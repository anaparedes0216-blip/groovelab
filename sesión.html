<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveLab</title>
    <link rel="stylesheet" href="sesión.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body> 

    <!-- NAVBAR -->
   <header class="navbar">
        <div class="nav-inner">
            <div class="nav-left logo">
    <a href="index.html">GrooveLab</a>
</div>

            <nav class="nav-center">
                <a href="artistas.html" >ARTISTAS</a>
                <a href="generos.html">GÉNEROS</a>
                <a href="preventa.html">PRE-VENTA</a>
                <a href="stock.html">STOCK</a>
                <a href="nosotros.html">NOSOTROS</a>
            </nav>

            <div class="nav-right">
                <div class="search-box">
                    <input type="text" placeholder="🔍">
                </div>
                <!-- CARRITO -->
    <div class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
    </div>

    <a class="login-btn" href="sesión.html">INICIAR SESIÓN / REGISTRARSE</a>
</div>

<div class="cart-popup" id="cart-popup">
    <div class="cart-item">
        <img id="popup-img" src="" alt="">
        <div class="cart-info">
            <p id="popup-title"></p>
            <span id="popup-price"></span>
        </div>
    </div>

    <a href="carrito.html" class="view-cart">Ver carrito</a>
</div>

<script>
    (function () {
    const navEntries = performance.getEntriesByType("navigation");
    if (navEntries.length > 0 && navEntries[0].type === "reload") {
        localStorage.removeItem("cartProducts");
        localStorage.removeItem("cartCount");
    }
})();
document.addEventListener("DOMContentLoaded", function () {

    const cartNumber = document.getElementById("cart-count");

    let cartCount = localStorage.getItem("cartCount")
        ? parseInt(localStorage.getItem("cartCount"))
        : 0;

    cartNumber.textContent = cartCount;

    const buttons = document.querySelectorAll(".add-btn, .btn-add");

    const popup = document.getElementById("cart-popup");
    const popupImg = document.getElementById("popup-img");
    const popupTitle = document.getElementById("popup-title");
    const popupPrice = document.getElementById("popup-price");

    buttons.forEach(button => {
        button.addEventListener("click", () => {

            const card = button.closest(".preventa-card, .stock-card");
            if (!card) return;

            const img = card.querySelector("img").src;
            const title = card.querySelector("h3").textContent;

            // 🔴 quitamos "S/." y lo volvemos número
            const priceText = card.querySelector("p")?.textContent || "S/. 0";
            const price = parseFloat(priceText.replace("S/.", "").trim());

            // 🔵 LEER CARRITO
            let cart = JSON.parse(localStorage.getItem("cartProducts")) || [];

            // 🔵 VER SI YA EXISTE
            const existingProduct = cart.find(item => item.title === title);

            if (existingProduct) {
                existingProduct.qty += 1;
            } else {
                cart.push({
                    img: img,
                    title: title,
                    price: price,
                    qty: 1
                });
            }

            // 🔵 GUARDAR
            localStorage.setItem("cartProducts", JSON.stringify(cart));

            // 🛒 contador
            cartCount++;
            cartNumber.textContent = cartCount;
            localStorage.setItem("cartCount", cartCount);

            // popup
            if (popup) {
                popupImg.src = img;
                popupTitle.textContent = title;
                popupPrice.textContent = "S/. " + price.toFixed(2);

                popup.classList.add("show");
                setTimeout(() => popup.classList.remove("show"), 3000);
            }
        });
    });

});
</script>




</header>

<div class="login-page">

    <!-- LADO IMAGEN -->
    <div class="login-image"></div>

    <!-- LADO FORM -->
    <div class="login-form">
        <h2>Bienvenido a GrooveLab</h2>
        <p>Inicia sesión para seguir explorando vinilos</p>

        <form>
            <input type="email" placeholder="Correo electrónico">
            <input type="password" placeholder="Contraseña">

            <button type="submit">Iniciar Sesión</button>

            <span class="divider">o</span>

            <div class="social-login">
                <button>Google</button>
                <button>Facebook</button>
            </div>

            <p class="register">
    ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
</p>
        </form>
    </div>

</div>

</body>
</html>
